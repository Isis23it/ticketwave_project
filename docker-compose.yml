services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketwave_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - ticketwave

  nginx:
    image: nginx:alpine
    container_name: ticketwave_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ticketwave

  db:
    image: mysql:8.0
    container_name: ticketwave_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ticketwave
      MYSQL_USER: ticketwave_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - ticketwave

networks:
  ticketwave:
    driver: bridge

volumes:
  dbdata:
    driver: local